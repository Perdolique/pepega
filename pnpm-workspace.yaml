packages:
  - apps/pepega
  - common/database
  - common/telegram
  - common/twitch
  - common/utils
  - workers/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  vue-demi: false
  workerd: false

catalog:
  drizzle-orm: 0.45.2
  ofetch: 1.5.1
  tsx: 4.21.1
  typescript: 5.9.3
  valibot: 1.4.2
  wrangler: 4.120.0

cleanupUnusedCatalogs: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild

saveExact: true
