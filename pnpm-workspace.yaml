packages:
  - apps/pepega
  - common/database
  - common/telegram
  - common/twitch
  - common/utils
  - workers/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  vue-demi: false
  workerd: false

catalog:
  drizzle-orm: 1.0.0-rc.4
  ofetch: 1.5.1
  tsx: 4.23.15
  typescript: 6.0.3
  valibot: 1.5.0
  wrangler: 4.152.0

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@pinia/nuxt@1.0.3'
  - pinia@4.1.0

nodeLinker: hoisted

overrides:
  '@nuxt/devtools': 4.0.0-beta.5

saveExact: true
